<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>MDPL CMMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #1B1E21; --panel: #24282C; --panel-raised: #2A2F34; --border: #383E44;
    --text: #E8EAED; --text-muted: #8B9198; --amber: #FFB020; --amber-dim: #6B4A16;
    --green: #3ECF8E; --green-bg: rgba(62, 207, 142, 0.14); --red: #E5484D; --radius: 8px;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 14px 40px; }
  .eyebrow { font-family: 'Oswald', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }
  h1 { font-family: 'Oswald', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin: 2px 0 0; color: var(--text); }
  h1 span { color: var(--amber); }
  header.appbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--panel); }
  select, input[type=number], input[type=date], input[type=text], input[type=email], input[type=password], textarea {
    background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius);
    padding: 9px 10px; font-family: 'JetBrains Mono', monospace; font-size: 14px;
  }
  textarea { width: 100%; min-height: 60px; resize: vertical; font-family: 'Inter', sans-serif; }
  label.field-label { font-family: 'Oswald', sans-serif; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 6px; }
  .field { margin-bottom: 12px; }
  button { font-family: 'Oswald', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 10px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--panel-raised); color: var(--text); cursor: pointer; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: rgba(255,176,32,0.12); border-color: var(--amber-dim); color: var(--amber); }
  button.ghost { background: none; }
  button.big { width: 100%; padding: 16px; font-size: 15px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .card-title { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.02em; margin: 0 0 4px; }
  .card-meta { color: var(--text-muted); font-size: 12px; font-family: 'JetBrains Mono', monospace; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 4px; font-family: 'Oswald', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .badge.open { background: rgba(255,176,32,0.14); color: var(--amber); }
  .badge.in_progress { background: rgba(77,163,255,0.14); color: #4DA3FF; }
  .badge.closed { background: var(--green-bg); color: var(--green); }
  .badge.pm { border: 1px solid var(--amber-dim); color: var(--amber); background: none; }
  .badge.breakdown { border: 1px solid var(--red); color: var(--red); background: none; }
  .readout-empty { font-size: 13px; color: var(--text-muted); padding: 24px 0; text-align: center; }
  .checklist-item { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 14px; font-family: 'Inter', sans-serif; }
  .checklist-item:last-child { border-bottom: none; }
  .checklist-item.done { color: var(--text-muted); text-decoration: line-through; }
  .tab-nav { display: flex; gap: 4px; border-bottom: 1px solid var(--border); padding: 0 14px; background: var(--panel); }
  .tab-btn { flex: none; background: transparent; border: none; border-radius: 0; padding: 10px 14px; color: var(--text-muted); border-bottom: 2px solid transparent; font-family: 'Oswald', sans-serif; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; }
  .tab-btn.active { color: var(--amber); border-bottom-color: var(--amber); }
  .hidden { display: none !important; }
  .toast-container { position: fixed; bottom: 20px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 200; pointer-events: none; }
  .toast { animation: slideUp .25s ease-out, fadeOut .3s ease-in 2.2s forwards; pointer-events: auto; padding: 10px 16px; border-radius: var(--radius); font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: .04em; color: #1B1E21; background: var(--green); box-shadow: 0 4px 16px rgba(0,0,0,.3); }
  .toast.err { background: var(--red); color: #fff; }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
  @keyframes fadeOut { to { opacity: 0 } }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen" class="wrap" style="min-height:100vh; display:flex; flex-direction:column; justify-content:center; max-width:340px;">
  <div class="eyebrow" style="text-align:center;">MDPL &middot; Maintenance</div>
  <h1 style="text-align:center; margin-bottom:6px;">CM<span>MS</span></h1>
  <p class="readout-empty" style="padding:0 0 20px;">Sign in to log and track maintenance work.</p>
  <div class="field"><label class="field-label">Email</label><input id="login-email" type="email" style="width:100%;"></div>
  <div class="field"><label class="field-label">Password</label><input id="login-password" type="password" style="width:100%;"></div>
  <button class="primary big" onclick="signIn()">Sign In</button>
  <p id="login-error" style="color:var(--red); font-size:13px; text-align:center; margin-top:14px; min-height:18px;"></p>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header class="appbar">
    <div>
      <p style="font-family:'Oswald',sans-serif; font-weight:600; margin:0; letter-spacing:0.02em;">MDPL <span style="color:var(--amber);">CMMS</span></p>
      <p class="readout-empty" style="margin:0; padding:0; font-size:11px; text-align:left;" id="who-name"></p>
    </div>
    <button id="logout-btn" style="padding:6px 10px; font-size:11px;" onclick="signOut()">Exit</button>
  </header>

  <div class="tab-nav">
    <button class="tab-btn active" data-tab="wo" onclick="switchTab('wo')">Work Orders</button>
    <button class="tab-btn" data-tab="assets" onclick="switchTab('assets')">Assets</button>
    <button class="tab-btn" data-tab="schedules" onclick="switchTab('schedules')">PM Schedules</button>
  </div>

  <main class="wrap">

    <!-- ---- WORK ORDERS TAB ---- -->
    <section id="tab-wo">
      <div class="row" style="margin-top:16px;">
        <select id="wo-filter" onchange="loadWorkOrders()">
          <option value="open,in_progress">Open</option>
          <option value="closed">Closed</option>
          <option value="open,in_progress,closed">All</option>
        </select>
        <button class="primary" onclick="openNewWoForm()" id="btn-new-wo">+ New Work Order</button>
      </div>

      <div id="new-wo-form" class="panel hidden">
        <div class="eyebrow" style="margin-bottom:10px;">New Work Order</div>
        <div class="field">
          <label class="field-label">Asset</label>
          <select id="wo-asset" style="width:100%;"></select>
        </div>
        <div class="field">
          <label class="field-label">Type</label>
          <select id="wo-type" style="width:100%;">
            <option value="breakdown">Breakdown / Fix</option>
            <option value="pm">PM (linked to a schedule)</option>
          </select>
        </div>
        <div id="wo-schedule-field" class="field hidden">
          <label class="field-label">Schedule</label>
          <select id="wo-schedule" style="width:100%;"></select>
        </div>
        <div class="field">
          <label class="field-label">Description</label>
          <textarea id="wo-description" placeholder="What needs to be done / was done"></textarea>
        </div>
        <div class="field" style="font-family:'Inter',sans-serif; font-size:13px; color:var(--text-muted);">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="wo-close-now" style="width:auto;"> Already done — create and close now
          </label>
        </div>
        <div class="row">
          <button class="primary" onclick="createWorkOrder()">Create</button>
          <button class="ghost" onclick="closeNewWoForm()">Cancel</button>
        </div>
      </div>

      <div id="wo-list"></div>
    </section>

    <!-- ---- ASSETS TAB ---- -->
    <section id="tab-assets" class="hidden">
      <div class="row" style="margin-top:16px;">
        <button class="primary" onclick="openNewAssetForm()" id="btn-new-asset">+ New Asset</button>
      </div>
      <div id="new-asset-form" class="panel hidden">
        <div class="eyebrow" style="margin-bottom:10px;">New Asset</div>
        <div class="field"><label class="field-label">Name</label><input id="asset-name" style="width:100%;"></div>
        <div class="field"><label class="field-label">Location</label><input id="asset-location" style="width:100%;"></div>
        <div class="field">
          <label class="field-label">Criticality</label>
          <select id="asset-criticality" style="width:100%;">
            <option value="">—</option>
            <option>P1</option><option>P2</option><option>P3</option><option>P4</option>
          </select>
        </div>
        <div class="row">
          <button class="primary" onclick="createAsset()">Create</button>
          <button class="ghost" onclick="closeNewAssetForm()">Cancel</button>
        </div>
      </div>
      <div id="asset-list"></div>
    </section>

    <!-- ---- SCHEDULES TAB ---- -->
    <section id="tab-schedules" class="hidden">
      <div class="row" style="margin-top:16px;">
        <button class="primary" onclick="openNewScheduleForm()" id="btn-new-schedule">+ New PM Schedule</button>
      </div>
      <div id="new-schedule-form" class="panel hidden">
        <div class="eyebrow" style="margin-bottom:10px;">New Recurring PM Schedule</div>
        <div class="field">
          <label class="field-label">Asset</label>
          <select id="sched-asset" style="width:100%;"></select>
        </div>
        <div class="field"><label class="field-label">Title</label><input id="sched-title" placeholder="e.g. 6-Month General PM" style="width:100%; font-family:'Inter',sans-serif;"></div>
        <div class="field"><label class="field-label">Interval (days)</label><input id="sched-interval" type="number" value="180" style="width:100%;"></div>
        <div class="field"><label class="field-label">First due date</label><input id="sched-due" type="date" style="width:100%;"></div>
        <div class="field"><label class="field-label">Reminder — days before due (optional)</label><input id="sched-reminder" type="number" style="width:100%;"></div>
        <div class="row">
          <button class="primary" onclick="createSchedule()">Create</button>
          <button class="ghost" onclick="closeNewScheduleForm()">Cancel</button>
        </div>
      </div>
      <div id="schedule-list"></div>
    </section>

  </main>
</div>

<div id="toast-container" class="toast-container"></div>

<script>
// ============================================================
// CONFIG — fill in your Supabase project details
// ============================================================
const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentRole = null;
let assetsCache = [];
let schedulesCache = [];

// ---------- toast ----------
function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast' + (kind === 'err' ? ' err' : '');
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

// ---------- auth ----------
async function signIn() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { errEl.textContent = error.message; return; }
  await onSignedIn(data.user);
}

async function signOut() {
  await sb.auth.signOut();
  currentUser = null; currentRole = null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
}

async function onSignedIn(user) {
  currentUser = user;
  const { data: roleRow, error } = await sb.from('user_roles').select('role, full_name').eq('user_id', user.id).single();
  if (error || !roleRow) {
    toast('No role assigned yet — ask an admin to add you to user_roles.', 'err');
    return;
  }
  currentRole = roleRow.role;
  document.getElementById('who-name').textContent = (roleRow.full_name || user.email) + ' \u00b7 ' + currentRole;
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  const canWrite = currentRole === 'admin' || currentRole === 'technician';
  document.getElementById('btn-new-wo').style.display = canWrite ? '' : 'none';
  document.getElementById('btn-new-schedule').style.display = canWrite ? '' : 'none';
  document.getElementById('btn-new-asset').style.display = currentRole === 'admin' ? '' : 'none';

  await loadAssets();
  await loadWorkOrders();
}

sb.auth.getSession().then(({ data }) => {
  if (data.session) onSignedIn(data.session.user);
});

// ---------- tabs ----------
function switchTab(tab) {
  ['wo','assets','schedules'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('hidden', t !== tab);
  });
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (tab === 'assets') loadAssets(true);
  if (tab === 'schedules') loadSchedules();
}

// ============================================================
// WORK ORDERS
// ============================================================
function openNewWoForm() {
  document.getElementById('new-wo-form').classList.remove('hidden');
  populateAssetSelect('wo-asset');
  document.getElementById('wo-type').onchange = () => {
    const isPm = document.getElementById('wo-type').value === 'pm';
    document.getElementById('wo-schedule-field').classList.toggle('hidden', !isPm);
    if (isPm) populateScheduleSelect('wo-schedule');
  };
}
function closeNewWoForm() { document.getElementById('new-wo-form').classList.add('hidden'); }

async function createWorkOrder() {
  const asset_id = document.getElementById('wo-asset').value;
  const type = document.getElementById('wo-type').value;
  const schedule_id = type === 'pm' ? document.getElementById('wo-schedule').value : null;
  const description = document.getElementById('wo-description').value.trim();
  const closeNow = document.getElementById('wo-close-now').checked;

  if (!asset_id) { toast('Pick an asset', 'err'); return; }

  const payload = {
    asset_id, type, description,
    schedule_id: schedule_id || null,
    created_by: currentUser.id,
    status: closeNow ? 'closed' : 'open',
    closed_at: closeNow ? new Date().toISOString() : null
  };

  const { data: wo, error } = await sb.from('work_orders').insert(payload).select().single();
  if (error) { toast(error.message, 'err'); return; }

  if (type === 'pm' && schedule_id) {
    const { data: items } = await sb.from('checklist_items').select('id').eq('schedule_id', schedule_id).eq('active', true);
    if (items && items.length) {
      const rows = items.map(i => ({ wo_id: wo.id, item_id: i.id, done: closeNow }));
      await sb.from('wo_checklist_results').insert(rows);
    }
  }

  toast('Work order created');
  closeNewWoForm();
  document.getElementById('wo-description').value = '';
  document.getElementById('wo-close-now').checked = false;
  loadWorkOrders();
}

async function loadWorkOrders() {
  const statuses = document.getElementById('wo-filter').value.split(',');
  const { data, error } = await sb
    .from('work_orders')
    .select('id, type, status, description, opened_at, closed_at, asset_id, schedule_id, assets(name)')
    .in('status', statuses)
    .order('opened_at', { ascending: false })
    .limit(50);

  const list = document.getElementById('wo-list');
  if (error) { list.innerHTML = '<div class="readout-empty">' + error.message + '</div>'; return; }
  if (!data || !data.length) { list.innerHTML = '<div class="readout-empty">No work orders here.</div>'; return; }

  list.innerHTML = '';
  for (const wo of data) {
    const card = document.createElement('div');
    card.className = 'panel';
    card.innerHTML = `
      <div class="row" style="margin-bottom:6px;justify-content:space-between">
        <div>
          <span class="badge ${wo.type}">${wo.type}</span>
          <span class="badge ${wo.status}">${wo.status.replace('_',' ')}</span>
        </div>
        <span class="card-meta">#${wo.id}</span>
      </div>
      <div class="card-title">${wo.assets?.name || 'Unknown asset'}</div>
      <div style="margin:6px 0; font-family:'Inter',sans-serif; font-size:14px;">${wo.description ? escapeHtml(wo.description) : '<span class="card-meta">No description</span>'}</div>
      <div class="card-meta">opened ${formatDate(wo.opened_at)}${wo.closed_at ? ' \u00b7 closed ' + formatDate(wo.closed_at) : ''}</div>
      <div id="checklist-${wo.id}"></div>
      <div class="row" style="margin-top:10px">
        ${wo.status !== 'closed' && (currentRole === 'admin' || currentRole === 'technician') ? `
          ${wo.status === 'open' ? `<button onclick="updateWoStatus(${wo.id},'in_progress')">Start</button>` : ''}
          <button class="primary" onclick="updateWoStatus(${wo.id},'closed')">Close</button>
        ` : ''}
      </div>
    `;
    list.appendChild(card);
    if (wo.type === 'pm' && wo.schedule_id) loadChecklistForWo(wo.id);
  }
}

async function updateWoStatus(id, status) {
  const payload = { status };
  if (status === 'closed') payload.closed_at = new Date().toISOString();
  const { error } = await sb.from('work_orders').update(payload).eq('id', id);
  if (error) { toast(error.message, 'err'); return; }
  toast('Updated');
  loadWorkOrders();
}

async function loadChecklistForWo(woId) {
  const { data, error } = await sb
    .from('wo_checklist_results')
    .select('id, done, checklist_items(description)')
    .eq('wo_id', woId);
  const box = document.getElementById('checklist-' + woId);
  if (!box || error || !data || !data.length) return;
  box.innerHTML = data.map(r => `
    <div class="checklist-item ${r.done ? 'done' : ''}">
      <input type="checkbox" ${r.done ? 'checked' : ''}
        ${currentRole === 'viewer' ? 'disabled' : ''}
        onchange="toggleChecklistItem(${r.id}, this.checked)">
      ${escapeHtml(r.checklist_items.description)}
    </div>
  `).join('');
}

async function toggleChecklistItem(resultId, done) {
  await sb.from('wo_checklist_results').update({ done, done_at: done ? new Date().toISOString() : null }).eq('id', resultId);
}

// ============================================================
// ASSETS
// ============================================================
function openNewAssetForm() { document.getElementById('new-asset-form').classList.remove('hidden'); }
function closeNewAssetForm() { document.getElementById('new-asset-form').classList.add('hidden'); }

async function createAsset() {
  const name = document.getElementById('asset-name').value.trim();
  const location = document.getElementById('asset-location').value.trim();
  const criticality = document.getElementById('asset-criticality').value || null;
  if (!name) { toast('Name required', 'err'); return; }
  const { error } = await sb.from('assets').insert({ name, location, criticality });
  if (error) { toast(error.message, 'err'); return; }
  toast('Asset created');
  closeNewAssetForm();
  document.getElementById('asset-name').value = '';
  document.getElementById('asset-location').value = '';
  await loadAssets(true);
}

async function loadAssets(render) {
  const { data, error } = await sb.from('assets').select('*').order('name');
  if (!error) assetsCache = data || [];
  if (render) {
    const list = document.getElementById('asset-list');
    if (error) { list.innerHTML = '<div class="readout-empty">' + error.message + '</div>'; return; }
    if (!assetsCache.length) { list.innerHTML = '<div class="readout-empty">No assets yet.</div>'; return; }
    list.innerHTML = assetsCache.map(a => `
      <div class="panel">
        <div class="card-title">${escapeHtml(a.name)} ${a.criticality ? '<span class="badge open">' + a.criticality + '</span>' : ''}</div>
        <div class="card-meta">${a.location || '\u2014'} \u00b7 ${a.status}</div>
      </div>
    `).join('');
  }
}

function populateAssetSelect(id) {
  const sel = document.getElementById(id);
  sel.innerHTML = assetsCache.map(a => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('');
}

// ============================================================
// SCHEDULES
// ============================================================
function openNewScheduleForm() {
  document.getElementById('new-schedule-form').classList.remove('hidden');
  populateAssetSelect('sched-asset');
}
function closeNewScheduleForm() { document.getElementById('new-schedule-form').classList.add('hidden'); }

async function createSchedule() {
  const asset_id = document.getElementById('sched-asset').value;
  const title = document.getElementById('sched-title').value.trim();
  const interval_days = parseInt(document.getElementById('sched-interval').value, 10);
  const next_due_at = document.getElementById('sched-due').value;
  const reminder_days_before = document.getElementById('sched-reminder').value || null;

  if (!asset_id || !title || !interval_days || !next_due_at) { toast('Fill all required fields', 'err'); return; }

  const { error } = await sb.from('recurring_schedules').insert({
    asset_id, title, interval_days, next_due_at, reminder_days_before
  });
  if (error) { toast(error.message, 'err'); return; }
  toast('Schedule created');
  closeNewScheduleForm();
  document.getElementById('sched-title').value = '';
  loadSchedules();
}

async function loadSchedules() {
  const { data, error } = await sb
    .from('recurring_schedules')
    .select('id, title, interval_days, next_due_at, active, assets(name)')
    .order('next_due_at');
  schedulesCache = data || [];
  const list = document.getElementById('schedule-list');
  if (error) { list.innerHTML = '<div class="readout-empty">' + error.message + '</div>'; return; }
  if (!schedulesCache.length) { list.innerHTML = '<div class="readout-empty">No PM schedules yet.</div>'; return; }

  list.innerHTML = '';
  for (const s of schedulesCache) {
    const card = document.createElement('div');
    card.className = 'panel';
    card.innerHTML = `
      <div class="card-title">${escapeHtml(s.title)}</div>
      <div class="card-meta">${s.assets?.name || ''} \u00b7 every ${s.interval_days}d \u00b7 next due ${s.next_due_at}</div>
      <div id="items-${s.id}" style="margin-top:8px"></div>
      ${currentRole !== 'viewer' ? `
        <div class="row" style="margin-top:8px">
          <input id="new-item-${s.id}" placeholder="Add checklist item..." style="flex:1; font-family:'Inter',sans-serif;">
          <button onclick="addChecklistItem(${s.id})">Add</button>
        </div>` : ''}
    `;
    list.appendChild(card);
    loadChecklistItems(s.id);
  }
}

async function loadChecklistItems(scheduleId) {
  const { data } = await sb.from('checklist_items').select('id, description').eq('schedule_id', scheduleId).eq('active', true).order('added_at');
  const box = document.getElementById('items-' + scheduleId);
  if (!box) return;
  if (!data || !data.length) { box.innerHTML = '<div class="card-meta">No checklist items yet.</div>'; return; }
  box.innerHTML = data.map(i => `<div class="checklist-item">${escapeHtml(i.description)}</div>`).join('');
}

async function addChecklistItem(scheduleId) {
  const input = document.getElementById('new-item-' + scheduleId);
  const description = input.value.trim();
  if (!description) return;
  const { error } = await sb.from('checklist_items').insert({ schedule_id: scheduleId, description });
  if (error) { toast(error.message, 'err'); return; }
  input.value = '';
  loadChecklistItems(scheduleId);
}

function populateScheduleSelect(id) {
  const assetId = document.getElementById('wo-asset').value;
  const sel = document.getElementById(id);
  sb.from('recurring_schedules').select('id, title').eq('asset_id', assetId).eq('active', true).then(({ data }) => {
    sel.innerHTML = (data || []).map(s => `<option value="${s.id}">${escapeHtml(s.title)}</option>`).join('');
  });
}

// ---------- utils ----------
function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
